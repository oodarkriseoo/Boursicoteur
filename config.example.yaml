# Copie ce fichier en config.yaml et adapte-le.
# Les secrets (clés d'API, jetons) ne vont jamais ici : ils se lisent dans
# les variables d'environnement nommées plus bas.

# Tes positions actuelles. Lues une seule fois, à la première mise en route
# du bot à plusieurs utilisateurs : ensuite elles se gèrent depuis Telegram
# (/positions, /ajouter, /retirer, /stop) et cette liste n'est plus relue.
# Le ticker est celui de Yahoo Finance
# (suffixe .PA pour Paris, .AS pour Amsterdam, rien pour les US).
# Le prix de revient est en euros. Pour une valeur cotée dans une autre
# devise (actions US), ajoute « devise: USD » : il sera converti au taux du jour.
# Facultatif : « horizon: long » ou « court ». Par défaut, les positions du PEA
# sont de long terme : le bot propose de les réévaluer au lieu de les vendre.
# Facultatif : « stop: 95.0 » (dans la devise de cotation) envoie une alerte
# dès que le cours passe sous ce niveau, ta règle de sortie décidée à froid.
portefeuille:
  - ticker: CW8.PA
    nom: Amundi MSCI World (PEA)
    enveloppe: PEA
    quantite: 5
    prix_revient: 520.0
  - ticker: NVDA
    nom: Nvidia
    enveloppe: CTO
    quantite: 3
    prix_revient: 120.0
    stop: 100.0

# Référence pour juger l'outil : est-ce qu'il fait mieux que garder cet ETF ?
reference: CW8.PA

seuils:
  baisse_seance_pct: 5        # alerte si une position perd plus de 5 % sur la séance (puis à chaque 3 points de plus)
  chute_rapide_pct: 3         # alerte si une position perd 3 % entre deux contrôles (30 min)
  risque_alerte: 50           # alerte « baisse inhabituelle » si le risque dépasse 50/100
  # Les seuils de baisse ci-dessus s'adaptent à chaque valeur : une baisse dans
  # sa respiration habituelle (replis passés, variation normale) n'alerte pas.
  baisse_depuis_sommet_pct: 15  # alerte si une position est à -15 % de son plus haut sur 3 mois
  perte_vs_prix_revient_pct: 20 # alerte si une position est à -20 % de ton prix de revient
  vix_alerte: 30              # alerte si l'indice de peur (VIX) dépasse 30
  volume_inhabituel_x: 3      # signal si le volume du jour vaut 3 fois la moyenne sur 20 jours

# Module « pépites IA » : l'univers surveillé. Ajoute ou retire librement.
theme_ia:
  univers:
    # Puces et équipement
    - NVDA
    - AMD
    - AVGO
    - TSM
    - ASML.AS
    - ARM
    - MU
    - INTC
    - MRVL
    - AMAT
    - LRCX
    # Européennes (STMicro et Soitec sont éligibles au PEA)
    - STMPA.PA
    - SOI.PA
    # Réseau, connectique, serveurs
    - ANET
    - ALAB
    - CRDO
    - SMCI
    - CLS
    # Énergie et refroidissement des data centers
    - VRT
    - VST
    - CEG
    # Petites valeurs : hébergement de calcul IA
    - APLD
    - IREN
    # Cloud IA et logiciels
    - CRWV
    - NBIS
    - PLTR
  mots_cles:
    - intelligence artificielle
    - artificial intelligence
    - " AI "
    - GPU
    - data center
    - datacenter
    - LLM
    - inference
    - semiconductor
  # Nombre maximum de pistes présentées chaque jour
  pistes_max: 5

# Autres thèmes suivis, au même titre que l'IA : chacun a son univers et ses
# mots-clés, et passe par le même score sur 100 (alertes « Opportunité » et
# classement du résumé). Ajoute, retire ou renomme librement.
# Les valeurs cotées en euros sont marquées « PEA possible » (à confirmer chez
# ton courtier) ; les autres vont sur le compte-titres. N'utilise que des
# tickers en euros ou en dollars : les autres devises ne sont pas converties.
# La note en commentaire est un jugement de départ (octobre 2026) sur le
# secteur, les derniers résultats, le prix déjà payé et la solidité ; le bot
# recalcule chaque jour son propre score avec les cours et les actus.
themes:
  electrification:
    libelle: Électrification et réseaux
    univers:
      - ENR.DE     # 78 Siemens Energy : carnet record, prévisions relevées
      - LR.PA      # 74 Legrand : data centers, prévisions relevées
      - SU.PA      # 72 Schneider Electric
      - NEX.PA     # 70 Nexans : prévisions relevées, dette en hausse après rachat
      - PRY.MI     # 68 Prysmian, câbles haute tension
      - GEV        # 66 GE Vernova, chère
      - SIE.DE     # 64 Siemens
      - ETN        # 62 Eaton
      - IBE.MC     # 60 Iberdrola, réseaux régulés, freinée par les taux
    mots_cles: [grid, power demand, electrification, transformer, utility, data center, réseau électrique]
    pistes_max: 3
  sante:
    libelle: Santé
    univers:
      - LLY        # 66 Eli Lilly, obésité
      - ARGX.BR    # 66 argenx, biotech en croissance
      - SAN.PA     # 64 Sanofi
      - EL.PA      # 62 EssilorLuxottica
      - VRTX       # 62 Vertex
      - ISRG       # 62 Intuitive Surgical, chère
    mots_cles: [FDA, approval, phase 3, trial, obesity, GLP-1, drug, autorisation, essai clinique]
    pistes_max: 3
  defense:
    libelle: Défense et aéronautique
    univers:
      - SAF.PA     # 82 Safran : +19 % au 1er semestre, prévisions relevées, trésorerie nette
      - AIR.PA     # 72 Airbus : carnet record, trésorerie consommée par la montée en cadence
      - HO.PA      # 68 Thales
      - LDO.MI     # 62 Leonardo
    mots_cles: [defense, defence, NATO, military, missile, aircraft, armement, OTAN]
    pistes_max: 3
  banques:
    libelle: Banques européennes
    univers:
      - GLE.PA     # 70 Société Générale : bénéfice record, rachat de 1,5 Md€
      - UCG.MI     # 66 UniCredit
      - BNP.PA     # 64 BNP Paribas, exposée à la dette française
      - INGA.AS    # 62 ING
      - SAN.MC     # 62 Santander
      - ISP.MI     # 62 Intesa Sanpaolo
    mots_cles: [ECB, BCE, interest rate, net interest income, buyback, rachat d'actions]
    pistes_max: 3
  materiaux:
    libelle: Matériaux critiques
    univers:
      - AI.PA      # 62 Air Liquide, la plus défensive
      - CCJ        # 60 Cameco, uranium, chère
      - FCX        # 60 Freeport-McMoRan, cuivre
    mots_cles: [copper, lithium, rare earth, uranium, mine, cuivre, terres rares]
    pistes_max: 2

# Opportunités scorées sur 100 : un catalyseur frais dans l'actu (partenariat,
# contrat, prise de participation, résultats relevés) confirmé par le marché
# (hausse, volumes). Contrôlé à chaque passage de la veille ; au-dessus du
# seuil, alerte immédiate et note au journal pour le bilan.
opportunites:
  activee: true
  seuil_alerte: 60
  alertes_max: 3              # par passage, pour ne pas être noyé
  modele: claude-sonnet-5-5   # modèle plus économique pour ces appels fréquents

# Actus non boursières : actualité mondiale et sources officielles (autorisations
# de médicaments, contrats du Pentagone, énergie), relues toutes les 5 minutes.
# Claude relie chaque événement aux valeurs suivies, surtout en second rang
# (fournisseur, client, coût d'une matière). Chaque lien est mesuré à 1 jour,
# 1 semaine et 4 semaines ; le bilan dit si ces pistes battent les autres.
# Coût : au plus un appel à Claude par quart d'heure, 40 par jour.
evenements:
  actives: true
  intervalle_min: 5
  pause_ia_min: 15
  appels_max_jour: 40
  confiance_alerte: 3         # alerte Telegram à partir de 3/5 ; en dessous, juste noté au journal
  alertes_max: 3
  modele: claude-sonnet-5-5
  flux:
    - https://feeds.bbci.co.uk/news/world/rss.xml
    - https://feeds.bbci.co.uk/news/business/rss.xml
    - https://www.lemonde.fr/international/rss_full.xml
    - https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml
    - https://www.ema.europa.eu/en/news.xml
    - https://www.war.gov/DesktopModules/ArticleCS/RSS.ashx?ContentType=400&Site=945&max=10
    - https://www.eia.gov/rss/todayinenergy.xml

# Phase 2 : conseils d'achat et de vente chiffrés, que tu passes toi-même.
# Chaque opportunité retenue reçoit un plan : prix maximum, stop, objectif et
# montant calculé pour que la perte au stop reste près de risque_par_position_pct
# de la poche. Les conseils sont suivis jusqu'au stop ou à l'objectif, et le
# bilan mensuel donne leur résultat net de frais.
conseils:
  actives: true
  poche_eur: 1000             # argent dédié aux conseils, à part de ton PEA long terme
  risque_par_position_pct: 2  # perte maximale visée par conseil, en % de la poche (20 € ici)
  position_max_pct: 25        # jamais plus de 25 % de la poche sur une seule valeur
  frais_ordre_eur: 1          # Trade Republic : 1 € par ordre
  ratio_objectif: 2           # objectif à 2 fois la distance au stop

# Courtier branché sur les boutons Telegram (voir README, « Ordres via IBKR »).
# Un ordre ne part qu'après « Acheter via IBKR » puis « Confirmer ».
courtier:
  type: aucun                 # « ibkr » pour activer
  hote: 127.0.0.1
  port: 4002                  # IB Gateway : 4002 en démo, 4001 en réel
  client_id: 17
  compte_demo: true           # refuse tout compte réel tant que c'est vrai
  plafond_ordre_eur: 300
  plafond_jour_eur: 600

# Introductions en bourse et dépôts de dossiers (S-1) aux États-Unis.
introductions:
  nasdaq: true
  sec_s1: true
  # La SEC exige un User-Agent avec un moyen de contact.
  sec_user_agent: "Boursicoteur contact@example.com"

flux_rss:
  - https://www.ecb.europa.eu/rss/press.html
  - https://www.federalreserve.gov/feeds/press_all.xml
  - https://services.lesechos.fr/rss/les-echos-finance-marches.xml
  # Actus par valeur (Yahoo Finance) : ajoutées automatiquement pour le
  # portefeuille et l'univers de chaque thème, inutile de les lister ici.

ia:
  activee: true
  modele: claude-opus-5-5
  effort: low                 # low suffit pour un résumé quotidien et limite le coût
  cle_env: ANTHROPIC_API_KEY
  # Seulement si ta clé n'est rattachée à aucun espace de travail (erreur
  # « anthropic-workspace-id ») : identifiant de l'espace, lu dans cette variable.
  espace_env: ANTHROPIC_WORKSPACE_ID

notifications:
  telegram:
    token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
  ntfy:
    topic_env: NTFY_TOPIC     # ex. https://ntfy.sh/mon-sujet-secret

# Plusieurs utilisateurs sur le même bot (voir README, « Partager le bot »).
# Chacun gère son portefeuille et ses valeurs surveillées depuis Telegram ;
# l'administrateur (TELEGRAM_CHAT_ID) accepte ou refuse chaque demande.
utilisateurs:
  max: 10                     # administrateur compris

planification:
  intervalle_veille_min: 30   # fréquence des contrôles en mode boucle
  heure_resume: "08:00"       # heure du résumé quotidien (heure de Paris)
  jour_bilan: 1               # 1er du mois : bilan mensuel des hypothèses

base_de_donnees: data/journal.sqlite
